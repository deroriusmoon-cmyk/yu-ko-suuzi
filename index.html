<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>有効数字 電卓</title>
  <style>
    :root {
      --blue: #17618f;
      --text: #203040;
      --pale: #eaf4fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 14px;
      display: grid;
      place-items: center;
      background: #e8eef3;
      color: var(--text);
      font-family: system-ui, sans-serif;
      font-size: 20px;
    }

    .calculator {
      width: min(100%, 600px);
      padding: clamp(16px, 3vw, 28px);
      border-radius: 22px;
      background: white;
      box-shadow: 0 10px 35px #20304025;
    }

    h1 {
      margin: 0;
      color: var(--blue);
      font-size: clamp(1.6rem, 3vw, 2rem);
      text-align: center;
    }

    .subtitle {
      margin: 2px 0 12px;
      text-align: center;
      font-size: 0.9rem;
    }

    .label {
      display: block;
      margin: 12px 0 6px;
      font-weight: bold;
    }

    button {
      min-width: 0;
      border: 1px solid #a8c3d4;
      border-radius: 11px;
      background: white;
      color: var(--text);
      font: inherit;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:hover { background: var(--pale); }
    button:active { transform: scale(0.97); }

    .fields {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 9px;
    }

    .field {
      min-height: 69px;
      padding: 8px 10px;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .field.active {
      border: 3px solid var(--blue);
      background: var(--pale);
    }

    .field-title {
      display: block;
      font-size: 0.75rem;
      font-weight: normal;
    }

    .field-value {
      display: block;
      font-size: clamp(1.2rem, 3vw, 1.7rem);
      line-height: 1.3;
    }

    sup {
      font-size: 0.7em;
      line-height: 0;
    }

    .precision,
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
    }

    .precision button {
      min-height: 50px;
      font-size: 1.1rem;
    }

    .precision button.selected {
      border-color: var(--blue);
      background: var(--blue);
      color: white;
    }

    .keypad button {
      min-height: clamp(56px, 7dvh, 76px);
      font-size: 1.4rem;
    }

    .keypad .small-key { font-size: 1.05rem; }
    .keypad .delete { background: #fff1d7; }
    .keypad .clear { background: #fbe4e4; }
    .keypad .exponent-key { background: #dceef9; }

    .answer {
      margin-top: 16px;
      padding: 14px 18px;
      border-radius: 14px;
      background: var(--pale);
    }

    .answer .label { margin-top: 0; }

    #result {
      min-height: 1.5em;
      font-size: clamp(1.6rem, 5vw, 2.3rem);
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    #note {
      margin: 5px 0 0;
      font-size: 0.85rem;
    }

    .help {
      margin: 12px 0 0;
      font-size: 0.82rem;
      line-height: 1.5;
    }

    /* タブレット横向き */
    @media (orientation: landscape) and (min-width: 700px) {
      .calculator { width: min(100%, 1050px); }

      .content {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: clamp(18px, 3vw, 36px);
        align-items: start;
      }

      .input-panel > .label { margin-top: 0; }

      .keypad button {
        min-height: clamp(45px, 9dvh, 70px);
      }
    }

    /* 高さが低い横画面 */
    @media (orientation: landscape) and (max-height: 550px) {
      body { font-size: 17px; }
      .calculator { padding: 12px 18px; }
      .label { margin: 6px 0 4px; }
      .field { min-height: 54px; }
      .precision button { min-height: 40px; }
      .keypad { gap: 6px; }
      .keypad button { min-height: 40px; }
      .answer { padding: 9px 12px; }
    }

    @media (max-width: 420px) {
      body { padding: 8px; font-size: 18px; }
      .calculator { padding: 15px; }
      .fields, .precision, .keypad { gap: 7px; }
    }
  </style>
</head>
<body>
  <main class="calculator">
    <h1>有効数字 電卓</h1>
    <p class="subtitle">数値と10の指数をテンキーで入力</p>

    <div class="content">
      <div class="readout">
        <span class="label">入力する場所を選択</span>
        <div class="fields">
          <button
            type="button"
            id="numberField"
            class="field active"
            aria-pressed="true"
          >
            <span class="field-title">数値</span>
            <span id="numberDisplay" class="field-value">0</span>
          </button>

          <button
            type="button"
            id="exponentField"
            class="field"
            aria-pressed="false"
          >
            <span class="field-title">10の指数</span>
            <span class="field-value">
              × 10<sup id="exponentDisplay">なし</sup>
            </span>
          </button>
        </div>

        <span class="label">有効数字を選択</span>
        <div id="precision" class="precision" aria-label="有効数字の桁数">
          <button type="button" data-digits="2" aria-pressed="false">2桁</button>
          <button type="button" data-digits="3" class="selected"
                  aria-pressed="true">3桁</button>
          <button type="button" data-digits="4" aria-pressed="false">4桁</button>
        </div>

        <div class="answer">
          <span class="label">変換結果</span>
          <div id="result" aria-live="polite">数値を入力</div>
          <p id="note"></p>
        </div>
      </div>

      <div class="input-panel">
        <span class="label">テンキー</span>
        <div id="keypad" class="keypad" aria-label="数値入力テンキー">
          <button type="button" data-key="7">7</button>
          <button type="button" data-key="8">8</button>
          <button type="button" data-key="9">9</button>

          <button type="button" data-key="4">4</button>
          <button type="button" data-key="5">5</button>
          <button type="button" data-key="6">6</button>

          <button type="button" data-key="1">1</button>
          <button type="button" data-key="2">2</button>
          <button type="button" data-key="3">3</button>

          <button type="button" data-key=".">.</button>
          <button type="button" data-key="0">0</button>
          <button type="button" data-key="delete" class="delete small-key"
                  aria-label="入力中の欄の最後の1文字を削除">⌫ 削除</button>

          <button type="button" data-key="clear" class="clear small-key">
            全消去
          </button>
          <button type="button" data-key="minus"
                  aria-label="入力中の欄の正負を切り替え">±</button>
          <button type="button" data-key="exponent"
                  class="exponent-key small-key"
                  aria-label="10の指数を入力">×10ⁿ</button>
        </div>
      </div>
    </div>

    <p class="help">
      例：4.50を入力 →「×10ⁿ」→ 3を入力すると、4.50 × 10³を変換します。
      指数を負にするときは、指数入力中に「±」を押してください。
      指数が−1・0・1になる結果は通常の数値で表示します。
    </p>
  </main>

  <script>
    let numberInput = "";
    let exponentInput = "";
    let exponentEnabled = false;
    let activeField = "number";
    let significantDigits = 3;

    const numberDisplay = document.getElementById("numberDisplay");
    const exponentDisplay = document.getElementById("exponentDisplay");
    const numberField = document.getElementById("numberField");
    const exponentField = document.getElementById("exponentField");
    const result = document.getElementById("result");
    const note = document.getElementById("note");

    function toSuperscript(value) {
      const table = {
        "-": "⁻",
        "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴",
        "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹"
      };

      return String(value)
        .split("")
        .map(character => table[character] ?? character)
        .join("");
    }

    function chooseField(field) {
      activeField = field;

      if (field === "exponent") {
        exponentEnabled = true;
      }

      update();
    }

    numberField.addEventListener("click", () => chooseField("number"));
    exponentField.addEventListener("click", () => chooseField("exponent"));

    function formatSignificant(raw, power, digits) {
      const negative = raw.startsWith("-");
      const unsigned = negative ? raw.slice(1) : raw;
      const [integerRaw, fraction = ""] = unsigned.split(".");
      const integer = integerRaw.replace(/^0+/, "");

      let exponent;
      let significantPart;

      if (integer !== "") {
        // 例：12.34 × 10² → 1.234 × 10³
        exponent = integer.length - 1 + power;
        significantPart = integer + fraction;
      } else {
        const firstNonZero = fraction.search(/[1-9]/);

        if (firstNonZero === -1) {
          return {
            text: "0",
            note: "0だけでは、測定値としての有効数字の桁数は決められません。"
          };
        }

        // 例：0.0045 × 10² → 4.5 × 10⁻¹
        exponent = -(firstNonZero + 1) + power;
        significantPart = fraction.slice(firstNonZero);
      }

      const padded = significantPart.padEnd(digits + 1, "0");
      const kept = padded.slice(0, digits).split("");
      const nextDigit = Number(padded[digits]);

      // 指定桁数の次の数字で四捨五入
      if (nextDigit >= 5) {
        let position = kept.length - 1;

        while (position >= 0 && kept[position] === "9") {
          kept[position] = "0";
          position--;
        }

        if (position >= 0) {
          kept[position] = String(Number(kept[position]) + 1);
        } else {
          // 9.99 → 有効数字2桁なら、1.0 × 10¹
          kept[0] = "1";
          exponent++;
        }
      }

      const roundedDigits = kept.join("");
      const sign = negative ? "−" : "";

      // 指数が−1、0、1の場合は通常の数値で表示
      if (exponent >= -1 && exponent <= 1) {
        const decimalPosition = exponent + 1;
        let decimal;

        if (decimalPosition <= 0) {
          decimal = "0." +
            "0".repeat(-decimalPosition) +
            roundedDigits;
        } else if (decimalPosition >= roundedDigits.length) {
          decimal = roundedDigits +
            "0".repeat(decimalPosition - roundedDigits.length);
        } else {
          decimal = roundedDigits.slice(0, decimalPosition) +
            "." +
            roundedDigits.slice(decimalPosition);
        }

        return {
          text: sign + decimal,
          note: `有効数字${digits}桁`
        };
      }

      const coefficient =
        roundedDigits[0] + "." + roundedDigits.slice(1);

      return {
        text: `${sign}${coefficient} × 10${toSuperscript(exponent)}`,
        note: `有効数字${digits}桁`
      };
    }

    function update() {
      numberDisplay.textContent = numberInput || "0";

      if (!exponentEnabled) {
        exponentDisplay.textContent = "なし";
      } else {
        exponentDisplay.textContent = toSuperscript(exponentInput || "0");
      }

      numberField.classList.toggle("active", activeField === "number");
      exponentField.classList.toggle("active", activeField === "exponent");
      numberField.setAttribute(
        "aria-pressed",
        String(activeField === "number")
      );
      exponentField.setAttribute(
        "aria-pressed",
        String(activeField === "exponent")
      );

      if (numberInput === "" || numberInput === "-") {
        result.textContent = "数値を入力";
        note.textContent = "";
        return;
      }

      if (exponentInput === "-") {
        result.textContent = "指数を入力";
        note.textContent = "「±」でもう一度切り替えるか、数字を入力してください。";
        return;
      }

      const power = exponentEnabled ? Number(exponentInput || "0") : 0;
      const formatted = formatSignificant(
        numberInput,
        power,
        significantDigits
      );

      result.textContent = formatted.text;
      note.textContent = formatted.note;
    }

    document.getElementById("keypad").addEventListener("click", event => {
      const button = event.target.closest("button[data-key]");
      if (!button) return;

      const key = button.dataset.key;

      if (key === "clear") {
        numberInput = "";
        exponentInput = "";
        exponentEnabled = false;
        activeField = "number";
        update();
        return;
      }

      if (key === "exponent") {
        chooseField("exponent");
        return;
      }

      if (activeField === "number") {
        if (key === "delete") {
          numberInput = numberInput.slice(0, -1);
        } else if (key === "minus") {
          numberInput = numberInput.startsWith("-")
            ? numberInput.slice(1)
            : "-" + numberInput;
        } else if (key === ".") {
          if (!numberInput.includes(".")) {
            numberInput =
              numberInput === "" || numberInput === "-"
                ? numberInput + "0."
                : numberInput + ".";
          }
        } else if (numberInput.length < 30) {
          numberInput += key;
        }
      } else {
        // 指数入力中は小数点を受け付けない
        if (key === "delete") {
          exponentInput = exponentInput.slice(0, -1);
        } else if (key === "minus") {
          exponentInput = exponentInput.startsWith("-")
            ? exponentInput.slice(1)
            : "-" + exponentInput;
        } else if (key !== ".") {
          const candidate = exponentInput + key;

          // 表示が極端に長くならないよう、入力する指数を±30以内にする
          if (Math.abs(Number(candidate)) <= 30 &&
              candidate.replace("-", "").length <= 2) {
            exponentInput = candidate;
          }
        }
      }

      update();
    });

    document.getElementById("precision").addEventListener("click", event => {
      const button = event.target.closest("button[data-digits]");
      if (!button) return;

      significantDigits = Number(button.dataset.digits);

      document.querySelectorAll("#precision button").forEach(item => {
        const selected = item === button;
        item.classList.toggle("selected", selected);
        item.setAttribute("aria-pressed", String(selected));
      });

      update();
    });

    update();
  </script>
</body>
</html>
